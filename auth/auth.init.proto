syntax = "proto3";

package auth;

option go_package = "github.com/eka-care/aorta-go/proto-generated/go/auth";
import "auth/auth.aenums.proto";
import "auth/auth.common.proto";

message AuthInit {
  AuthMethod method = 1;
  string identifier = 2;
  // Will be the email id for EmailOtp, mobile number for MobileOtp.
  // For Google and Apple, it will be None.
  optional Attributes attributes = 3;
}

message AuthInitResponse {
  string txn_id = 1;
  string message = 2;
  AuthMethod method = 3;
  optional AuthError error = 4;
  optional string  next_otp_request = 5 [json_name = "next_otp_request"];
}


