syntax = "proto3";

package auth;

option go_package = "github.com/eka-care/aorta-go/proto-generated/go/auth";
import "auth/auth.aenums.proto";
import "auth/auth.common.proto";


message AuthLoginRequest {
  AuthMethod method = 1;
}

message AuthLoginResponse {
  Tokens tokens = 1;
  // This will be present only if the user is old and will be Type1 profile.
  optional Profile profile = 2;
}