syntax = "proto3";

package auth;

option go_package = "github.com/eka-care/aorta-go/proto-generated/go/auth";
import "auth/auth.common.proto";

message MagicLinkRequest {
  string  mobile = 1;
  string  uuid = 2;
  string oid = 3;
  int64 ttl_min = 4;
}

message  MagicLinkResponse {
  string  magic_token = 1;
}
