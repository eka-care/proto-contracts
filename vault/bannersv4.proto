syntax = "proto3";

package vault.bannersv4;

import "vault/cta.proto";
import "vault/banner_body_parameter.proto";

option go_package = "github.com/eka-care/proto-contracts/go/vault/bannersv4";

/* Banner represents banner info. */
message Banner {
  Item item = 1;
  string hash = 2; // Hash of the banner.

  message Item {
    string title = 1;              // Title of the banner.
    optional string sub_title = 2; // Sub Title of the banner.
    vault.common.CTA cta = 3;      // CTA configuration for button.
    string banner_id =
        4; // ID represents banner identifier for tracking in Mixpanel.
    repeated vault.banner_body_parameter.BannerBodyParameter body_parameters =
        5; // dynamic parameters with-in sub title to be filled by client.
    Assets assets = 6;                // Assets for the banner.
    optional Highlight highlight = 7; // Hightlight type of the banner.

    message Assets {
      BgAsset bg_asset = 1;
      optional TopAsset top_asset = 2;

      message BgAsset {
        oneof image {
          string img = 1;    // Image link for the banner.
          string lottie = 2; // Lottie link for the banner.
        }
      }

      message TopAsset {
        string img = 1;    // Image link for the banner.
        string lottie = 2; // Lottie link for the banner.
      }
    }

    enum Highlight {
      TYPE_UNSPECIFIED = 0; // Unspecified.
      TYPE_ONE = 1;
      TYPE_TWO = 2;
      TYPE_THREE = 3;
      TYPE_FOUR = 4;
    }
  }
}

/* BannersResponse represents banners on records page such as gmail sync,
 * insights etc. */
message BannersResponse {
  repeated Banner banners = 1;
  optional string next_page_token = 2;
}

message BannersAPIResponse {
  /* ErrorCode represents list of errors */
  enum ErrorCode {
    ERROR_UNSPECIFIED = 0; // Error -> Unspecified.
  }

  /* Error represents error resonse of API */
  message Error {
    ErrorCode code = 1; // Error Code.
    string message = 2; // Error Message.
  }

  oneof result {
    BannersResponse response = 1;
    Error error = 2;
  }
}