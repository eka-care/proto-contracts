syntax = "proto3";
     
package vault.documents;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/eka-care/proto-contracts/go/vault/documents";

/* Document type suggests type of document uploaded to the vault. */
enum DocumentType {
    DOCUMENT_TYPE_UNSPECIFIED = 0; // DocumentType -> Unspecified.
  
    DOCUMENT_TYPE_LAB_REPORT = 1; // DocumentType -> Lab report.
  
    DOCUMENT_TYPE_PRESCRIPTION = 2; // DocumentType -> Prescription.
    DOCUMENT_TYPE_OTHERS = 3;       // DocumentType -> Other.
}

/* FileType of the uploaded document.*/
enum FileType {
  FILETYPE_UNSPECIFIED = 0; // FileType -> Unspecified.
  FILETYPE_IMG = 1;         // FileType -> Image file.
  FILETYPE_PDF = 2;         // FileType -> PDF file.
}

/* List of documents along with the offset to fetch next page document list. */
message DocumentList {
    repeated Document documents = 1;
    optional string offset = 2;
}

/* Document describes attributes of vault document. */
message Document {
  string oid = 1;                               // Profile ID.
  string document_id = 2;                       // Document ID.
  DocumentType document_type = 3;               // Type of the uploaded document.
  string thumbnail = 4;                         // Thumbnail url of the document.
  google.protobuf.Timestamp created_at = 5;     // Time at which the document was created or uploaded.
  google.protobuf.Timestamp document_date = 6;  // Date of the lab-report or prescription or other.
  FileProcessing file_response = 7;             // Doctor related document response.
  DoctorResponse doctor_response = 8;           // File related document response.
  DocumentTags document_tags = 9;               // Tags associated with document.
}

/* DocumentTags represents tags for the document. */
message DocumentTags {
  repeated string user_tags = 1;      // User added tags for the document.
  repeated string dervied_tags = 2;   // Tags derived based on the vitals in the document.
}

/* FileProcessing represents file related attributes for the document. */
message FileProcessing {
  bool is_smart_report_available = 1;      // Is the uploaded document a medical lab report.
  bool is_analyzing = 2;                   // Document still in analysis process of a smart report.
  bool is_processing = 3;                  // Is document in processing state.
  FileType file_type = 4;                  // Type of document uploaded, IMG or PDF.
  optional GetFileResponse file = 5;       // GetFileResponse describes file of the uploaded document.
  repeated string content_type = 6;        // Content type of the document.
  uint32 files_count = 7;                  // Number of files in the document.
}

/* DoctorResponse represent doctor related attributes for document response. */
message DoctorResponse {
  string doctor_id = 1;                     // Doctor ID.
  string clinic_id = 2;                     // Clinic ID.
  optional SearchMetaData search_meta = 3;  // Search meta defines page number, file, highlight of the document.
}

/* GetFileResponse describes files under the document. */
message GetFileResponse {
  string asset_url = 1;    // Asset uri of the uploaded document.
  string file_type = 2;    // File type of the uploaded document.
  string share_text = 3;   // Share text of the uploaded document.
}

/* SearchMetaData describes the metadata within the smart report. */
message SearchMetaData  {
  string highlight = 1; // Highlight a vital.
  uint32 page = 2;      // Page of the report.
  uint32 file_num = 3;  // File number within the document.
}