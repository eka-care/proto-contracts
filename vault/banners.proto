syntax = "proto3";

package vault.banners;

import "vault/cta.proto";
import "vault/banner_body_parameter.proto";

option go_package = "github.com/eka-care/proto-contracts/go/vault/banners";

/* BannersResponse represents banners on records page such as gmail sync,
 * insights etc. */
message BannersResponse {
  /* Banner represents multiple banner on the records screen. */
  repeated Banner banners = 1;
}

/* Banner represents configuration. */
message Banner {
  string title = 1;               // Title of the banner.
  optional string body = 2;       // Body or description of the banner.
  vault.common.CTA cta = 3;       // CTA configuration for button.
  string colour = 4;              // Colour of the banner in hex code.
  string iconBackgroundColor = 5; // Colour of the banner in hex code.
  optional Tag tag = 6;                    // Tag information for the banner
  oneof image {
    string img = 7;               // Image link for the banner.
    string lottie = 8;            // Lottie link for the banner.
  }
  repeated vault.banner_body_parameter.BannerBodyParameter body_parameters =
      9;                          // dynamic parameters with body.
  optional string banner_id = 10; // ID represents banner/card identifier.
}

message Tag {
  string tagTitle = 1;            // Tag title
  string tagBackgroundColor = 2;  // Colour of the tag background in hex code.
  string titleBackgroundColor = 3; // Colour of the tag title in hex code.
}