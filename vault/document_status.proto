syntax = "proto3";

package vault.doc_status;

option go_package = "github.com/eka-care/proto-contracts/go/vault/docstatus";

/* DocumentStatus represents status of given document id list. */
message DocumentStatus {
  repeated Document document_status = 1; // Status of requested document ids.
}

/* Document represents status for smart report analysis. */
message Document {
  bool is_analyzing = 1;                  // If document is in processing.
  bool is_smart_report_available = 2;     // Is document a smart report.
  optional string document_date = 3;      // Date of the document (lab report, prescription).
  optional string thumbnail = 4;          // Thumbnail of the lab report.
  bool is_accessible = 5;                 // Is_accessible represents document.
  optional string patient_id = 6;         // ID of the patient on document.
  repeated string tags = 7;               // Derived tags of the document.
}

/* DocumentList represents list of document ids for request body. */
message DocumentList {
  repeated string documents = 1; // List of document ids.
}