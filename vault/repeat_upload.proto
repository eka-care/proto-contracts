syntax = "proto3";

package vault.insights;

option go_package = "github.com/eka-care/proto-contracts/go/vault/repeat_upload";

message  ViewMyHealthResponse {
  bool is_analysing = 1;
  int32 no_of_records = 2;
  message HealthCategories {
    int32 vitals_found =1;
    int32 concerns =2;
    int32 trends_updated=3;
    int32 latest_added=4;
  }
  HealthCategories healthCategories = 4;
}
