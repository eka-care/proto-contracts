syntax = "proto3";

package insurance;

import "google/protobuf/timestamp.proto";
import "insurance/types.proto";
import "insurance/payment_frequency.proto";
import "insurance/gender.proto";
import "insurance/insurer.proto";

option go_package = "github.com/eka-care/proto-contracts/go/insurance";

/* InsuranceResponse */
message InsuranceResponse {
  string job_id = 1;
  string meta = 2; // metadata.
  InsuranceData response = 3;

  /* InsuranceData represents . */
  message InsuranceData {
    optional LinkedInsurerProviderEntity insurance_provider = 1;
    optional InsuranceType insurance_type = 2;
    optional PlanDetails plan_details = 3;
    optional PolicyDetails policy_details = 4;

    message PolicyDetails {
      optional Entity policy_number = 1;
      optional PolicyDate policy_dates = 2;
      optional CoverageDetails coverage_details = 3;
      repeated Members insured_members = 4;

      message Members {
        optional EntityNumber age = 1;
        optional EntityGender gender = 2;
        optional Entity name = 3;
        optional EntityTimestamp dob = 4;
        optional Entity member_id = 5;
        optional string suggested_patient_id = 6;
      }
    }
  }
}

message InsuranceType {
  float confidence = 1;
  Type value = 2;
  optional SubType sub_type = 3;
}

message CoverageDetails {
  optional EntityNumber premium_amount = 1;
  optional PremiumFrequency premium_payment_frequency = 2;
  optional EntityNumber sum_insured = 3;
  optional EntityNumber deductible_amount = 4;
}

message PremiumFrequency {
  float confidence = 1;
  string value = 3;
  PaymentFrequencyType linked_value = 2;
}

message PlanDetails {
  optional Entity plan_name = 1;
  optional Entity addon_plan_name = 2;
  optional Entity rider_name = 3;
  optional Entity uin_number = 4;
  optional Entity product_name = 5;
}

message PolicyDate {
  optional EntityTimestamp policy_end_date = 3;
  optional EntityTimestamp policy_issued_date = 1;
  optional EntityTimestamp policy_start_date = 2;
}

message EntityTimestamp {
  float confidence = 1;
  google.protobuf.Timestamp value = 2;
}

message Entity {
  float confidence = 1;
  string value = 2;
}

message LinkedInsurerProviderEntity {
  float confidence = 1;
  string value = 2;
  Insurer linked_value = 3;
}

message EntityNumber {
  float confidence = 1;
  float value = 2;
}

message EntityGender {
  float confidence = 1;
  Gender value = 2;
}
